name: ci
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  java:
    name: Maven tests, demo, schema benchmark, fat jar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Generate benchmark schemas
        run: python3 bench/generate_schemas.py
      - name: Unit tests
        run: mvn -q -B test
      - name: Demo (window-function reconstruction on DuckDB)
        run: mvn -q -B compile exec:java -Dexec.mainClass=com.example.audit.demo.DemoRunner
      - name: Schema benchmark
        run: mvn -q -B compile exec:java -Dexec.mainClass=com.example.audit.bench.SchemaBenchmark
      - name: Fat jar builds
        run: mvn -q -B package -DskipTests

  sql-matrix:
    name: Every sql/ file on DuckDB, Spark and Trino against golden outputs
    runs-on: ubuntu-24.04
    services:
      trino:
        image: trinodb/trino:483
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install DuckDB, pyspark and the Trino client
        run: pip install -r ci/requirements.txt
      - name: Wait for Trino
        run: |
          for i in $(seq 1 60); do
            if curl -sf localhost:8080/v1/info | grep -q '"starting":false'; then echo ready; exit 0; fi
            sleep 2
          done
          echo "Trino did not start"; exit 1
      - name: Run the golden matrix
        run: python3 ci/run_sql_matrix.py --engines duckdb,spark,trino --trino-host localhost --trino-port 8080 --out ci/matrix.md
      - name: Matrix as job summary
        if: always()
        run: cat ci/matrix.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sql-dialect-matrix
          path: ci/matrix.md

  bench-smoke:
    name: Benchmark script on the smoke configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install benchmark dependencies
        run: pip install -r bench/requirements.txt
      - name: Run
        run: make bench-smoke
      - uses: actions/upload-artifact@v6
        with:
          name: bench-smoke-results
          path: results-smoke

  wikimedia-smoke:
    name: Wikimedia field study steps on a synthetic capture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install study dependencies
        run: pip install -r study/wikimedia/requirements.txt
      - name: Steps 3 to 7 on a synthetic capture, planted counts checked
        run: make wikimedia-smoke
      - name: Results as job summary
        if: always()
        run: cat results-smoke-wikimedia/SUMMARY.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wikimedia-smoke-results
          path: |
            results-smoke-wikimedia/*.csv
            results-smoke-wikimedia/*.json
            results-smoke-wikimedia/*.sql
            results-smoke-wikimedia/SUMMARY.md

  crash-restart:
    name: Flink to Iceberg job fails, restarts from the last checkpoint, counts match
    runs-on: ubuntu-24.04
    services:
      kafka:
        image: apache/kafka:3.7.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          CLUSTER_ID: 5L6g3nShTeMCtK00X86swQ
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Crash and restart test
        env:
          REQUIRE_KAFKA: '1'
          KAFKA_BOOTSTRAP: localhost:9092
        run: mvn -q -B test -Dtest=CrashRestartTest
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Pipeline measurements on the smoke configuration
        run: |
          pip install -r bench/requirements.txt
          python3 bench/pipeline.py --config bench/config.smoke.json --out results-smoke-pipeline
      - name: Evidence as job summary
        if: always()
        run: cat results/crash_restart_case1.md results/crash_restart_case2.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: crash-restart-evidence
          path: results/crash_restart_case*.md
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pipeline-smoke-results
          path: results-smoke-pipeline

  aws-offline:
    name: AWS scale run code without AWS (generator check, Flink app tests, Terraform validate, estimate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.0
      - name: Install benchmark dependencies
        run: pip install -r bench/requirements.txt
      - name: Step files equal benchmark.generate() output
        run: python3 bench/aws/check_generate_steps.py
      - name: Scripts compile
        run: python3 -m py_compile bench/aws/*.py infra/estimate.py
      - name: Policies are valid JSON
        run: for f in infra/iam/*.json; do python3 -m json.tool "$f" > /dev/null; done
      - name: Flink application unit tests and jar
        run: mvn -q -B -f bench/aws/flink-app/pom.xml verify
      - name: Terraform format and validate
        run: |
          terraform fmt -check -recursive infra
          for r in budget base stream; do
            terraform -chdir=infra/$r init -backend=false -input=false > /dev/null
            terraform -chdir=infra/$r validate
          done
      - name: Cost estimate regenerates unchanged
        run: |
          python3 infra/estimate.py --out "$RUNNER_TEMP/COST_ESTIMATE.md"
          diff infra/COST_ESTIMATE.md "$RUNNER_TEMP/COST_ESTIMATE.md"
