# Test logging: warnings only, so a Kafka client retry or a Flink failure shows up in the
# surefire output without the INFO stream from the embedded cluster.
log4j.rootLogger=WARN, console
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{HH:mm:ss.SSS} %-5p %c{1} - %m%n
log4j.logger.org.apache.kafka.clients.producer=WARN
log4j.logger.org.apache.flink.runtime.executiongraph=WARN
log4j.logger.org.apache.hadoop=ERROR
